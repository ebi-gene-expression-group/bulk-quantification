# Hide sensitive information
show_analysis_paths: false
show_analysis_time: false

# Custom branding
title: "RNA-seq Quality Control Report"
subtitle: "Expression Atlas RNA-seq Analysis Results"
intro_text: "This report summarizes the quality control metrics for RNA-seq analysis."

# Custom logo
custom_logo: "https://www.ebi.ac.uk/gxa/resources/images/expression-atlas.png"
custom_logo_url: "https://www.ebi.ac.uk/gxa/"
custom_logo_title: "Expression Atlas"

# Clean up sample names to remove sensitive paths
fn_clean_sample_names: true
extra_fn_clean_exts:
  - ".fastq.gz"
  - ".fq.gz"
  - "_R1"
  - "_R2"
  - "_001"

# Remove file search patterns that might expose sensitive paths
fn_ignore_paths:
  - "*/work/*"
  - "*/tmp/*"
  - "*/.nextflow/*"

# Sample name cleaning
sample_names_ignore:
  - "*work*"
  - "*tmp*"
  - "*cache*"

# Custom report header to replace workflow summary info
report_header_info:
  - "Pipeline": "nf-core/rnaseq"
  - "Configuration": "https://github.com/your-org/configs"
  - "Analysis Platform": "Expression Atlas"
  - "Documentation": "https://www.ebi.ac.uk/expression-atlas/"
